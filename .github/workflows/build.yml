# Build + test on every push; attach the exe to a GitHub Release on tags.
#
# The build MUST run on Windows (build.mjs copies the local node.exe and
# injects the SEA blob — the output is a Windows PE).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # create/update releases and upload the exe on tag pushes

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    env:
      # Optional code signing: set both repo secrets to enable it (see
      # release-kit/docs/CODE-SIGNING.md). Empty secrets -> step skipped,
      # build stays unsigned.
      CODESIGN_PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
      CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the exe
        run: npm run build

      - name: Sign exe (only if signing secrets are configured)
        if: env.CODESIGN_PFX_B64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_B64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found on runner' }
          # /tr timestamp: signature stays valid after the cert expires.
          & $signtool sign /f $pfx /p $env:CODESIGN_PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist\WiFiScanner.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
          & $signtool verify /pa dist\WiFiScanner.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed ($LASTEXITCODE)" }
          Remove-Item $pfx -Force

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiScanner
          path: dist/WiFiScanner.exe
          if-no-files-found: error

      # Tag push -> create (or update) the GitHub Release and attach the exe.
      # If .github/release-body.md exists it is used as the release text,
      # otherwise GitHub auto-generates notes (edit them afterwards).
      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notesArgs = @()
          if (Test-Path .github/release-body.md) {
            $notesArgs = @('--notes-file', '.github/release-body.md')
          } else {
            $notesArgs = @('--generate-notes')
          }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/WiFiScanner.exe --clobber
          } else {
            gh release create $tag --verify-tag --title "WiFi Scanner $tag" @notesArgs dist/WiFiScanner.exe
          }
