PackageIdentifier: ahsanbhutta.WiFiScanner
PackageVersion: 1.0.0
PackageLocale: en-US
Publisher: ahsanbhutta
PublisherUrl: https://github.com/ahsanbhutta
PackageName: WiFi Scanner
PackageUrl: https://github.com/ahsanbhutta/wifi-scanner
License: MIT
LicenseUrl: https://github.com/ahsanbhutta/wifi-scanner/blob/main/LICENSE
ShortDescription: Scan your own WiFi/LAN and identify attached devices with vendor and model info.
Description: |-
  Local network device scanner for Windows. Pings and probes your own LAN,
  resolves vendors via Wireshark's OUI database, and fingerprints devices
  (mDNS, SSDP, NetBIOS, open ports) into device types and models with
  confidence levels. Runs a local web dashboard on 127.0.0.1 — no monitor
  mode, no telemetry, no admin rights required.
